<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Camera Scanner v7.1</title>
<script src="vendor/jspdf.umd.min.js"></script>

<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#0b1220;color:#fff}.top{padding:12px 14px;background:#111b30;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:4}.top b{font-size:18px}.top{flex-wrap:wrap}.top .btn{min-height:44px}@media(max-width:480px){.top b{font-size:16px}.top{gap:6px;padding:10px}.top .btn{padding:10px;font-size:12px}}.grow{flex:1}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:700}.primary{background:#fff;color:#111}.danger{background:#ef4444;color:#fff}.viewer{position:relative;background:#000;min-height:58vh;display:flex;align-items:center;justify-content:center;overflow:hidden}video{width:100%;max-height:68vh;object-fit:contain}.shot{position:absolute;bottom:18px;width:68px;height:68px;border-radius:50%;border:6px solid #fff;background:#e5e7eb;box-shadow:0 0 0 3px #0008}.count{position:absolute;top:12px;right:12px;background:#000a;padding:7px 10px;border-radius:20px}.panel{padding:12px}.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.thumb{background:#17233a;border-radius:10px;overflow:hidden;position:relative}.thumb img{width:100%;height:150px;object-fit:cover;display:block;cursor:pointer}.previewModal{position:fixed;inset:0;background:#000e;z-index:20;display:none;flex-direction:column}.previewModal.open{display:flex}.previewHead{padding:10px;display:flex;gap:8px;align-items:center}.previewBody{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}.previewBody img{max-width:100%;max-height:78vh;object-fit:contain}.previewActions{padding:10px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.thumb .n{position:absolute;top:5px;left:5px;background:#000b;border-radius:15px;padding:3px 7px}.thumb button{position:absolute;right:5px;top:5px;border:0;border-radius:50%;width:30px;height:30px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.hint{color:#b8c4d9;font-size:13px}.hidden{display:none}.status{padding:9px;border-radius:8px;background:#17233a;margin-top:8px}.meta{margin-top:14px;padding:12px;background:#111b30;border-radius:12px}.meta label{display:block;font-size:13px;color:#b8c4d9;margin:8px 0 5px}.field{width:100%;padding:11px;border-radius:9px;border:1px solid #334155;background:#fff;color:#111}.airow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.airow .field{flex:1;min-width:190px}.filename{font-size:13px;color:#dbeafe;word-break:break-all;margin-top:8px}.thumb img{object-fit:contain;background:#fff}.btn:disabled,.shot:disabled{opacity:.45}.field{font-size:16px}.viewer{min-height:45vh}.hint{padding:4px 0}</style></head><body>
<div class="top"><b>Camera Scanner</b><span class="grow"></span><button class="btn danger" id="exitBtn">Đóng · Về trang chủ</button><button class="btn primary" id="doneBtn">Hoàn tất</button></div>
<div class="viewer" id="viewer"><video id="video" autoplay playsinline muted></video><div class="count"><span id="count">0</span> trang · <span id="size">0 MB</span></div><button class="shot" id="shot" aria-label="Chụp"></button></div>
<div class="panel"><div class="actions"><button class="btn primary" id="cameraBtn">Mở lại camera</button><label class="btn primary">Thêm ảnh<input id="files" type="file" accept="image/*" multiple hidden></label><button class="btn danger" id="clearBtn">Xóa tất cả</button></div><div class="hint">Chạm nút tròn để chụp liên tục. Camera chỉ đóng khi bấm Hoàn tất. Có thể thêm nhiều ảnh từ máy.</div><div id="status" class="status">Đang khởi động camera…</div><div id="thumbs" class="thumbs"></div><div class="meta"><label>Chế độ scan</label><select id="mode" class="field"><option value="color">Scan sáng — giữ màu dấu, chữ ký</option><option value="gray">Scan sáng — ảnh xám</option><option value="original">Giữ màu tự nhiên</option></select><label>Tên tài liệu</label><input id="docName" class="field" placeholder="Hợp đồng"><div class="filename">Tên file: <b id="filePreview"></b></div></div><div class="actions"><button class="btn primary" id="pdfBtn">Tạo PDF & tải về máy</button></div></div><div class="hint">Ảnh chỉ được xử lý tạm trên thiết bị. PDF sẽ tải trực tiếp về máy, không lưu Google Drive.</div><div id="previewModal" class="previewModal"><div class="previewHead"><b id="previewTitle">Xem ảnh</b><span class="grow"></span><button class="btn primary" id="closePreview">Đóng</button></div><div class="previewBody"><img id="previewImg"></div><div class="previewActions"><button class="btn primary" id="prevImg">← Trước</button><button class="btn primary" id="rotateImg">↻ Xoay</button><button class="btn danger" id="deleteImg">Xóa ảnh</button><button class="btn primary" id="nextImg">Sau →</button></div></div><script src="scanner.js"></script></body></html>
