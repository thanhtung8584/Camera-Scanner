<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Camera Scanner</title>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#0b1220;color:#fff}.top{padding:12px 14px;background:#111b30;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:4}.top b{font-size:18px}.grow{flex:1}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:700}.primary{background:#fff;color:#111}.danger{background:#ef4444;color:#fff}.viewer{position:relative;background:#000;min-height:58vh;display:flex;align-items:center;justify-content:center;overflow:hidden}video{width:100%;max-height:68vh;object-fit:contain}.shot{position:absolute;bottom:18px;width:68px;height:68px;border-radius:50%;border:6px solid #fff;background:#e5e7eb;box-shadow:0 0 0 3px #0008}.count{position:absolute;top:12px;right:12px;background:#000a;padding:7px 10px;border-radius:20px}.panel{padding:12px}.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.thumb{background:#17233a;border-radius:10px;overflow:hidden;position:relative}.thumb img{width:100%;height:150px;object-fit:cover;display:block;cursor:pointer}.previewModal{position:fixed;inset:0;background:#000e;z-index:20;display:none;flex-direction:column}.previewModal.open{display:flex}.previewHead{padding:10px;display:flex;gap:8px;align-items:center}.previewBody{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}.previewBody img{max-width:100%;max-height:78vh;object-fit:contain}.previewActions{padding:10px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.thumb .n{position:absolute;top:5px;left:5px;background:#000b;border-radius:15px;padding:3px 7px}.thumb button{position:absolute;right:5px;top:5px;border:0;border-radius:50%;width:30px;height:30px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.hint{color:#b8c4d9;font-size:13px}.hidden{display:none}.status{padding:9px;border-radius:8px;background:#17233a;margin-top:8px}iframe{display:none}</style></head><body>
<div class="top"><b>Camera Scanner</b><span class="grow"></span><button class="btn primary" id="doneBtn">Hoàn tất</button></div>
<div class="viewer" id="viewer"><video id="video" autoplay playsinline muted></video><div class="count"><span id="count">0</span> trang</div><button class="shot" id="shot" aria-label="Chụp"></button></div>
<div class="panel"><div class="actions"><button class="btn primary" id="cameraBtn">Mở lại camera</button><label class="btn primary">Thêm ảnh<input id="files" type="file" accept="image/*" multiple hidden></label><button class="btn danger" id="clearBtn">Xóa tất cả</button></div><div class="hint">Chạm nút tròn để chụp liên tục. Camera chỉ đóng khi bấm Hoàn tất. Có thể thêm nhiều ảnh từ máy.</div><div id="status" class="status">Đang khởi động camera…</div><div id="thumbs" class="thumbs"></div><div class="actions"><input id="name" value="scan.pdf" style="flex:1;min-width:180px;padding:11px;border-radius:9px;border:0"><button class="btn primary" id="pdfBtn">Tạo PDF & lưu Drive</button></div></div><div id="previewModal" class="previewModal"><div class="previewHead"><b id="previewTitle">Xem ảnh</b><span class="grow"></span><button class="btn primary" id="closePreview">Đóng</button></div><div class="previewBody"><img id="previewImg"></div><div class="previewActions"><button class="btn primary" id="prevImg">← Trước</button><button class="btn primary" id="rotateImg">↻ Xoay</button><button class="btn danger" id="deleteImg">Xóa ảnh</button><button class="btn primary" id="nextImg">Sau →</button></div></div><iframe name="uploadFrame" id="uploadFrame"></iframe>
<form id="uploadForm" class="hidden" method="post" target="uploadFrame"><input name="token" id="token"><input name="name" id="upName"><textarea name="data" id="upData"></textarea></form>
<script>
const $=id=>document.getElementById(id), q=new URLSearchParams(location.search), endpoint=q.get('endpoint')||'', token=q.get('token')||'';let stream=null,pages=[],previewIndex=0;
function msg(t){$('status').textContent=t}function render(){ $('count').textContent=pages.length;$('thumbs').innerHTML=pages.map((x,i)=>`<div class="thumb" draggable="true" data-i="${i}"><span class="n">${i+1}</span><img src="${x}" onclick="openPreview(${i})"><button onclick="event.stopPropagation();removePage(${i})">×</button></div>`).join('');bindDrag()}
async function startCamera(){try{stopCamera();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});$('video').srcObject=stream;await $('video').play();msg('Camera đang mở — có thể chụp liên tục.')}catch(e){msg('Không mở được camera: '+e.message+'. Kiểm tra quyền camera và dùng HTTPS/Chrome/Safari.') }}
function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('video').srcObject=null}
function capture(){const v=$('video');if(!stream||!v.videoWidth){msg('Camera chưa sẵn sàng.');return}let max=1800,scale=Math.min(1,max/v.videoWidth),c=document.createElement('canvas');c.width=Math.round(v.videoWidth*scale);c.height=Math.round(v.videoHeight*scale);c.getContext('2d').drawImage(v,0,0,c.width,c.height);pages.push(c.toDataURL('image/jpeg',.82));render();msg('Đã chụp trang '+pages.length+' — camera vẫn đang mở.');if(navigator.vibrate)navigator.vibrate(35)}
function removePage(i){pages.splice(i,1);render();if($('previewModal').classList.contains('open')){if(!pages.length)closePreview();else openPreview(Math.min(i,pages.length-1))}}
function openPreview(i){if(!pages.length)return;previewIndex=Math.max(0,Math.min(i,pages.length-1));$('previewImg').src=pages[previewIndex];$('previewTitle').textContent='Trang '+(previewIndex+1)+' / '+pages.length;$('previewModal').classList.add('open')}
function closePreview(){$('previewModal').classList.remove('open')}
function stepPreview(d){if(!pages.length)return;previewIndex=(previewIndex+d+pages.length)%pages.length;openPreview(previewIndex)}
async function rotateCurrent(){if(!pages.length)return;let img=new Image;img.src=pages[previewIndex];await img.decode();let c=document.createElement('canvas');c.width=img.height;c.height=img.width;let x=c.getContext('2d');x.translate(c.width/2,c.height/2);x.rotate(Math.PI/2);x.drawImage(img,-img.width/2,-img.height/2);pages[previewIndex]=c.toDataURL('image/jpeg',.84);render();openPreview(previewIndex)}
function bindDrag(){let from=null;document.querySelectorAll('.thumb').forEach(el=>{el.ondragstart=()=>from=+el.dataset.i;el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();let to=+el.dataset.i;if(from===null||from===to)return;let [x]=pages.splice(from,1);pages.splice(to,0,x);render()}})}
$('closePreview').onclick=closePreview;$('prevImg').onclick=()=>stepPreview(-1);$('nextImg').onclick=()=>stepPreview(1);$('rotateImg').onclick=rotateCurrent;$('deleteImg').onclick=()=>removePage(previewIndex);$('shot').onclick=capture;$('doneBtn').onclick=()=>{stopCamera();msg('Đã kết thúc phiên chụp. Kiểm tra thứ tự rồi tạo PDF.')};$('cameraBtn').onclick=startCamera;$('clearBtn').onclick=()=>{if(confirm('Xóa toàn bộ ảnh?')){pages=[];render()}};
$('files').onchange=async e=>{for(const f of e.target.files){if(!f.type.startsWith('image/'))continue;let u=await new Promise(r=>{let fr=new FileReader;fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});pages.push(u)}render();e.target.value='';msg('Đã thêm ảnh. Có thể tiếp tục chụp hoặc tạo PDF.')};
$('pdfBtn').onclick=async()=>{if(!pages.length){msg('Chưa có trang nào.');return}if(!endpoint||!token){msg('Hãy mở Scanner từ nút Chụp liên tục trong hệ thống Apps Script.');return}let btn=$('pdfBtn');btn.disabled=true;msg('Đang tạo PDF…');try{const {jsPDF}=window.jspdf;let pdf=null;for(let i=0;i<pages.length;i++){let img=new Image;img.src=pages[i];await img.decode();let landscape=img.width>img.height,w=landscape?297:210,h=landscape?210:297;if(!pdf)pdf=new jsPDF({orientation:landscape?'l':'p',unit:'mm',format:'a4',compress:true});else pdf.addPage('a4',landscape?'l':'p');let r=Math.min(w/img.width,h/img.height),iw=img.width*r,ih=img.height*r;pdf.addImage(pages[i],'JPEG',(w-iw)/2,(h-ih)/2,iw,ih,undefined,'FAST')}let data=pdf.output('datauristring'),b64=data.split(',')[1]||'';if(b64.length>34*1024*1024)throw Error('PDF quá lớn để tải lên. Hãy giảm số trang.');$('uploadForm').action=endpoint;$('token').value=token;$('upName').value=($('name').value||'scan.pdf').replace(/\.pdf$/i,'')+'.pdf';$('upData').value=b64;$('uploadForm').submit();msg('Đang lưu PDF lên Google Drive…')}catch(e){msg('Lỗi: '+e.message);btn.disabled=false}};
window.addEventListener('message',e=>{let d=e.data||{};if(d.type!=='SCAN_UPLOAD_RESULT')return;$('pdfBtn').disabled=false;if(d.ok){msg('Đã lưu: '+d.fileName);if(d.fileUrl){let a=document.createElement('a');a.href=d.fileUrl;a.target='_blank';a.textContent='Mở file trên Google Drive';a.style='color:white;display:inline-block;margin-top:8px';$('status').append(document.createElement('br'),a)}}else msg('Lỗi lưu Drive: '+d.message)});window.addEventListener('beforeunload',stopCamera);startCamera();
</script></body></html>
