<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Camera Scanner • App con</title>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#0b1220;color:#fff}.top{padding:12px 14px;background:#111b30;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:4}.top b{font-size:18px}.grow{flex:1}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:700}.primary{background:#fff;color:#111}.danger{background:#ef4444;color:#fff}.viewer{position:relative;background:#000;min-height:58vh;display:flex;align-items:center;justify-content:center;overflow:hidden}video{width:100%;max-height:68vh;object-fit:contain}.shot{position:absolute;bottom:18px;width:68px;height:68px;border-radius:50%;border:6px solid #fff;background:#e5e7eb;box-shadow:0 0 0 3px #0008}.count{position:absolute;top:12px;right:12px;background:#000a;padding:7px 10px;border-radius:20px}.panel{padding:12px}.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.thumb{background:#17233a;border-radius:10px;overflow:hidden;position:relative}.thumb img{width:100%;height:150px;object-fit:cover;display:block;cursor:pointer}.previewModal{position:fixed;inset:0;background:#000e;z-index:20;display:none;flex-direction:column}.previewModal.open{display:flex}.previewHead{padding:10px;display:flex;gap:8px;align-items:center}.previewBody{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}.previewBody img{max-width:100%;max-height:78vh;object-fit:contain}.previewActions{padding:10px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.thumb .n{position:absolute;top:5px;left:5px;background:#000b;border-radius:15px;padding:3px 7px}.thumb button{position:absolute;right:5px;top:5px;border:0;border-radius:50%;width:30px;height:30px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.hint{color:#b8c4d9;font-size:13px}.hidden{display:none}.status{padding:9px;border-radius:8px;background:#17233a;margin-top:8px}.meta{margin-top:14px;padding:12px;background:#111b30;border-radius:12px}.meta label{display:block;font-size:13px;color:#b8c4d9;margin:8px 0 5px}.field{width:100%;padding:11px;border-radius:9px;border:1px solid #334155;background:#fff;color:#111}.airow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.airow .field{flex:1;min-width:190px}.filename{font-size:13px;color:#dbeafe;word-break:break-all;margin-top:8px}iframe{display:none}
/* Chỉ điều chỉnh trình bày; giữ nguyên logic Camera Scanner v6.6. */
html{height:100%}body{height:100vh;height:100dvh;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,1fr);grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}.top{grid-column:1/-1;position:relative;padding:10px 14px;border-bottom:1px solid #2d3d57}.top b{font-size:17px}.btn{cursor:pointer;font:600 13px system-ui;min-height:40px;border-radius:8px;padding:9px 12px}.btn:disabled{opacity:.55;cursor:wait}.btn:focus-visible,.shot:focus-visible,.field:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.top .btn{white-space:nowrap}.viewer{margin:12px 0 12px 12px;border-radius:12px;border:1px solid #263752;min-height:0;height:calc(100% - 24px);grid-column:1;grid-row:2}.viewer video{position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:contain}.shot{left:50%;transform:translateX(-50%);bottom:18px;cursor:pointer;touch-action:manipulation;z-index:2}.shot:active{background:#93c5fd}.count{z-index:2}.panel{grid-column:2;grid-row:2;min-height:0;min-width:0;overflow:auto;scrollbar-width:thin;padding:12px}.panel>.actions:first-child{margin-top:0}.thumbs{grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:8px;margin-top:10px}.thumb img{height:110px;object-fit:contain}.meta{padding:12px}.meta label{margin-top:10px}.field{padding:9px;font-size:14px}.filename{overflow-wrap:anywhere}.panel .actions:last-child .btn{width:100%;background:#2563eb;color:#fff}.panel+.hint{grid-column:1/-1;font-size:11px;padding:7px 12px;border-top:1px solid #263752}.previewBody{min-height:0}.previewBody img{max-height:100%}.previewHead{flex-shrink:0}.previewActions{flex-shrink:0;padding-bottom:max(10px,env(safe-area-inset-bottom))}.previewModal{height:100vh;height:100dvh}[hidden]{display:none!important}.return-notice{grid-column:1/-1;grid-row:2;align-self:center;justify-self:center;text-align:center;padding:24px}.is-closed>.top,.is-closed>.viewer,.is-closed>.panel,.is-closed>.hint{display:none}
@media(max-width:760px){html{height:auto}body{display:block;height:auto;min-height:100vh;min-height:100dvh;overflow:auto}.top{position:sticky;top:0;flex-wrap:wrap;gap:6px;padding:8px 10px}.top b{font-size:15px}.top .btn{font-size:12px;min-height:36px;padding:8px}.viewer{height:clamp(180px,48dvh,460px);min-height:180px;margin:10px;border-radius:10px}.panel{overflow:visible;padding:0 10px 12px}.thumbs{grid-template-columns:repeat(3,minmax(0,1fr))}.field{font-size:16px}.meta{margin-top:12px}.shot{width:64px;height:64px;bottom:14px}.panel+.hint{padding-bottom:max(10px,env(safe-area-inset-bottom))}.return-notice{padding:24px}.previewActions .btn{font-size:12px;padding:9px}.top .grow{flex:1}.top #returnBtn{display:none}.embedded .top #returnBtn{display:inline-block}}
@media(max-height:430px) and (min-width:761px){.top{padding:6px 10px}.viewer{margin:8px 0 8px 8px;height:calc(100% - 16px)}.panel{padding:8px}.panel+.hint{display:none}body{grid-template-rows:auto minmax(0,1fr)}}
</style></head><body>
<div class="top"><b>Camera Scanner</b><span class="grow"></span><button class="btn primary" id="doneBtn">Hoàn tất</button><button class="btn primary" id="returnBtn">Quay về PDF</button><button class="btn primary" id="exitBtn" aria-label="Đóng giao diện">✕ Đóng</button></div>
<div class="viewer" id="viewer"><video id="video" autoplay playsinline muted></video><div class="count"><span id="count">0</span> trang</div><button class="shot" id="shot" aria-label="Chụp"></button></div>
<div class="panel"><div class="actions"><button class="btn primary" id="cameraBtn">Mở lại camera</button><label class="btn primary">Thêm ảnh<input id="files" type="file" accept="image/*" multiple hidden></label><button class="btn danger" id="clearBtn">Xóa tất cả</button></div><div class="hint">Chạm nút tròn để chụp liên tục. Camera chỉ đóng khi bấm Hoàn tất. Có thể thêm nhiều ảnh từ máy.</div><div id="status" class="status">Đang khởi động camera…</div><div id="thumbs" class="thumbs"></div><div class="meta"><label for="fileName">Tên file PDF</label><input id="fileName" class="field" maxlength="180" placeholder="Ngày-tháng-năm_Tên tài liệu"><div class="filename">Tên tải về: <b id="filePreview"></b></div></div><div class="actions"><button class="btn primary" id="pdfBtn">Tạo PDF & tải về máy</button></div></div><div class="hint">Ảnh chỉ được xử lý tạm trên thiết bị. PDF sẽ tải trực tiếp về máy, không lưu Google Drive.</div><div id="previewModal" class="previewModal"><div class="previewHead"><b id="previewTitle">Xem ảnh</b><span class="grow"></span><button class="btn primary" id="closePreview">Đóng</button></div><div class="previewBody"><img id="previewImg"></div><div class="previewActions"><button class="btn primary" id="prevImg">← Trước</button><button class="btn primary" id="rotateImg">↻ Xoay</button><button class="btn danger" id="deleteImg">Xóa ảnh</button><button class="btn primary" id="nextImg">Sau →</button></div></div><iframe name="uploadFrame" id="uploadFrame"></iframe>
<form id="uploadForm" class="hidden" method="post" target="uploadFrame"><input name="token" id="token"><input name="name" id="upName"><textarea name="data" id="upData"></textarea></form>
<script>
const $=id=>document.getElementById(id);let stream=null,pages=[],previewIndex=0;
function msg(t){$('status').textContent=t}

function defaultFileName(){const d=new Date(),z=n=>String(n).padStart(2,'0');return z(d.getDate())+'-'+z(d.getMonth()+1)+'-'+d.getFullYear()+'_Tai_lieu'}
function suggestedName(){let name=$('fileName').value.trim().replace(/(?:\.pdf)+$/i,'').replace(/[\x00-\x1f<>:"/\\|?*]/g,'_').replace(/[. ]+$/g,'').slice(0,170);return (name||defaultFileName())+'.pdf'}
function updateFilePreview(){$('filePreview').textContent=suggestedName()}
function render(){ $('count').textContent=pages.length;$('thumbs').innerHTML=pages.map((x,i)=>`<div class="thumb" draggable="true" data-i="${i}"><span class="n">${i+1}</span><img src="${x}" onclick="openPreview(${i})"><button onclick="event.stopPropagation();removePage(${i})">×</button></div>`).join('');bindDrag()}
async function startCamera(){try{stopCamera();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});$('video').srcObject=stream;await $('video').play();msg('Camera đang mở — có thể chụp liên tục.')}catch(e){msg('Không mở được camera: '+e.message+'. Kiểm tra quyền camera và dùng HTTPS/Chrome/Safari.') }}
function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('video').srcObject=null}
function capture(){const v=$('video');if(!stream||!v.videoWidth){msg('Camera chưa sẵn sàng.');return}let max=1800,scale=Math.min(1,max/v.videoWidth),c=document.createElement('canvas');c.width=Math.round(v.videoWidth*scale);c.height=Math.round(v.videoHeight*scale);c.getContext('2d').drawImage(v,0,0,c.width,c.height);pages.push(c.toDataURL('image/jpeg',.82));render();msg('Đã chụp trang '+pages.length+' — camera vẫn đang mở.');if(navigator.vibrate)navigator.vibrate(35)}
function removePage(i){pages.splice(i,1);render();if($('previewModal').classList.contains('open')){if(!pages.length)closePreview();else openPreview(Math.min(i,pages.length-1))}}
function openPreview(i){if(!pages.length)return;previewIndex=Math.max(0,Math.min(i,pages.length-1));$('previewImg').src=pages[previewIndex];$('previewTitle').textContent='Trang '+(previewIndex+1)+' / '+pages.length;$('previewModal').classList.add('open')}
function closePreview(){$('previewModal').classList.remove('open')}
function stepPreview(d){if(!pages.length)return;previewIndex=(previewIndex+d+pages.length)%pages.length;openPreview(previewIndex)}
async function rotateCurrent(){if(!pages.length)return;let img=new Image;img.src=pages[previewIndex];await img.decode();let c=document.createElement('canvas');c.width=img.height;c.height=img.width;let x=c.getContext('2d');x.translate(c.width/2,c.height/2);x.rotate(Math.PI/2);x.drawImage(img,-img.width/2,-img.height/2);pages[previewIndex]=c.toDataURL('image/jpeg',.84);render();openPreview(previewIndex)}
function bindDrag(){let from=null;document.querySelectorAll('.thumb').forEach(el=>{el.ondragstart=()=>from=+el.dataset.i;el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();let to=+el.dataset.i;if(from===null||from===to)return;let [x]=pages.splice(from,1);pages.splice(to,0,x);render()}})}
$('fileName').value=defaultFileName();$('fileName').addEventListener('input',updateFilePreview);updateFilePreview();$('closePreview').onclick=closePreview;$('prevImg').onclick=()=>stepPreview(-1);$('nextImg').onclick=()=>stepPreview(1);$('rotateImg').onclick=rotateCurrent;$('deleteImg').onclick=()=>removePage(previewIndex);$('shot').onclick=capture;$('doneBtn').onclick=()=>{stopCamera();msg(pages.length?'Đã kết thúc phiên chụp. Kiểm tra tên file rồi tải PDF.':'Chưa có ảnh. Bấm Mở lại camera để tiếp tục.');$('fileName').focus()};$('cameraBtn').onclick=startCamera;$('clearBtn').onclick=()=>{if(confirm('Xóa toàn bộ ảnh?')){pages=[];render()}};
$('files').onchange=async e=>{for(const f of e.target.files){if(!f.type.startsWith('image/'))continue;let u=await new Promise(r=>{let fr=new FileReader;fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});pages.push(u)}render();e.target.value='';msg('Đã thêm ảnh. Có thể tiếp tục chụp hoặc tạo PDF.')};
$('pdfBtn').onclick=async()=>{if(!pages.length){msg('Chưa có trang nào.');return}let btn=$('pdfBtn');btn.disabled=true;msg('Đang tạo PDF trên thiết bị…');try{const {jsPDF}=window.jspdf;let pdf=null;for(let i=0;i<pages.length;i++){let img=new Image;img.src=pages[i];await img.decode();let landscape=img.width>img.height,w=landscape?297:210,h=landscape?210:297;if(!pdf)pdf=new jsPDF({orientation:landscape?'l':'p',unit:'mm',format:'a4',compress:true});else pdf.addPage('a4',landscape?'l':'p');let r=Math.min(w/img.width,h/img.height),iw=img.width*r,ih=img.height*r;pdf.addImage(pages[i],'JPEG',(w-iw)/2,(h-ih)/2,iw,ih,undefined,'FAST')}let fileName=suggestedName();let blob=pdf.output('blob'),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=fileName;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);msg('Đã tạo PDF và gửi lệnh tải về máy: '+fileName)}catch(e){msg('Lỗi: '+e.message)}finally{btn.disabled=false}};
window.addEventListener('beforeunload',stopCamera);startCamera();
</script>
<section id="returnNotice" class="return-notice" hidden><h2>Đã đóng camera</h2><p>Ảnh tạm đã được xóa.</p><button class="btn primary" id="reopenScanner">Mở lại</button></section>
<script>
// Tích hợp đóng khung: độc lập với script chụp và xử lý gốc ở phía trên.
(function(){
  const embedded=window.parent!==window;
  document.body.classList.toggle('embedded',embedded);
  if(!embedded)document.getElementById('returnBtn').hidden=true;
  let closed=false;
  function returnToParent(){
    if($('pdfBtn').disabled){msg('Đang xử lý. Vui lòng đợi hoàn tất trước khi đóng.');return;}
    if(pages.length&&!confirm('Còn '+pages.length+' trang trong phiên. Đóng và xóa ảnh tạm?'))return;
    closed=true;stopCamera();pages=[];render();closePreview();$('previewImg').removeAttribute('src');$('files').value='';
    $('fileName').value=defaultFileName();updateFilePreview();
    document.body.classList.add('is-closed');$('returnNotice').hidden=false;
    // Tín hiệu điều khiển, không chứa file hoặc dữ liệu cá nhân.
    if(embedded)window.parent.postMessage({type:'CAMERA_SCANNER_CLOSE'},'*');
    else if(window.opener)window.close();
  }
  $('exitBtn').onclick=returnToParent;$('returnBtn').onclick=returnToParent;
  $('reopenScanner').onclick=()=>location.reload();
  // Tắt stream nếu yêu cầu quyền camera hoàn tất sau khi đã bấm đóng.
  $('video').addEventListener('loadedmetadata',()=>{if(closed)stopCamera()});
  window.addEventListener('pagehide',stopCamera);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('previewModal').classList.contains('open'))closePreview();else returnToParent()}});
})();
</script></body></html>
